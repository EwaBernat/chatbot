<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img"
     aria-label="Logo Pomorskiego Centrum Terapii Pedagogicznej">
  <title>Pomorskie Centrum Terapii Pedagogicznej</title>
  <defs>
    <radialGradient id="tarcza" cx="38%" cy="26%" r="82%">
      <stop offset="0%"   stop-color="#6E4C9B"/>
      <stop offset="55%"  stop-color="#583A83"/>
      <stop offset="100%" stop-color="#43286A"/>
