  <!-- obręcz -->
  <circle cx="300" cy="300" r="298" fill="#4A2C77"/>
  <circle cx="300" cy="300" r="286" fill="#D9CCE9"/>
  <circle cx="300" cy="300" r="272" fill="url(#tarcza)"/>

  <!-- łodygi -->
  <g fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round">
    <path d="M300 272 L300 176"/>
    <path d="M300 272 C296 236 278 206 253 186"/>
    <path d="M300 272 C304 236 322 206 347 186"/>
    <path d="M300 272 C288 240 262 214 231 199"/>
    <path d="M300 272 C312 240 338 214 369 199"/>
