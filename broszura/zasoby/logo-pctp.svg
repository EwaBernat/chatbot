  <!-- płatki: zewnętrzne (lawenda), wewnętrzne (łosoś), środkowy (pomarańcz) -->
  <g>
    <ellipse cx="232" cy="176" rx="20" ry="43" fill="#9C8AC6" transform="rotate(-32 232 176)"/>
    <ellipse cx="368" cy="176" rx="20" ry="43" fill="#9C8AC6" transform="rotate(32 368 176)"/>
    <ellipse cx="258" cy="152" rx="21" ry="46" fill="#F0A472" transform="rotate(-17 258 152)"/>
    <ellipse cx="342" cy="152" rx="21" ry="46" fill="#F0A472" transform="rotate(17 342 152)"/>
    <ellipse cx="300" cy="139" rx="22" ry="49" fill="#E8722F"/>
  </g>

  <!-- serce kwiatu -->
  <circle cx="300" cy="176" r="13" fill="#FDFBF6"/>

  <!-- sygnatura -->
  <text x="300" y="418" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif"
