<!-- ══ LOGOTYP PCTP · EduPlaner 2026 ══════════════════════════════════
     Wklej blok <symbol> RAZ, tuż po otwarciu <body>. Potem używaj
     <use href="#pctp-logo"/> tyle razy, ile trzeba — znak zostaje wektorowy,
     a plik nie rośnie z każdym powtórzeniem.
     Kolory logotypu ustaw wg tła: ciemne tło → --lockup-name:#fff,
     jasne tło → --lockup-name:#2D1B69. Rok zawsze pomarańczem.
══════════════════════════════════════════════════════════════════════ -->

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="pctp-logo" viewBox="0 0 600 600">
    <defs>
        <radialGradient id="pctpDisc" cx="40%" cy="30%" r="78%">
          <stop offset="0%" stop-color="#6B4795"/>
          <stop offset="55%" stop-color="#523277"/>
          <stop offset="100%" stop-color="#3B2359"/>
        </radialGradient>
      </defs>
      <circle cx="300" cy="300" r="298" fill="#3A2258"/>
      <circle cx="300" cy="300" r="288" fill="#CFC5E3"/>
      <circle cx="300" cy="300" r="272" fill="#452A6B"/>
      <circle cx="300" cy="300" r="264" fill="url(#pctpDisc)"/>
    
      <g stroke="#C79C27" stroke-width="8.5" stroke-linecap="round" fill="none">
        <path d="M301 190 L301 272"/>
        <path d="M247 198 Q262 242 301 272"/>
        <path d="M355 198 Q340 242 301 272"/>
      </g>
    
      <g>
        <ellipse cx="245" cy="172" rx="22" ry="43" fill="#9C8BC6" transform="rotate(-30 245 172)"/>
        <ellipse cx="357" cy="172" rx="22" ry="43" fill="#9C8BC6" transform="rotate(30 357 172)"/>
        <ellipse cx="272" cy="150" rx="24" ry="51" fill="#F0A472" transform="rotate(-14 272 150)"/>
        <ellipse cx="330" cy="150" rx="24" ry="51" fill="#EE9660" transform="rotate(14 330 150)"/>
        <ellipse cx="301" cy="142" rx="26" ry="56" fill="#E2712F"/>
        <circle cx="301" cy="173" r="14" fill="#FFFFFF"/>
      </g>
    
      <text x="300" y="412" text-anchor="middle" fill="#F8F2E7"
            font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
            font-size="122" font-weight="700" letter-spacing="4">PCTP</text>
  </symbol>
</svg>

<style>
/* Domyślnie wariant NA JASNYM TLE. Na ciemnym tle dodaj klasę:
   <div class="logo na-ciemnym"> — nic więcej nie trzeba zmieniać. */
.logo{
  display:flex;align-items:center;gap:17px;
  --lockup-name:#2D1B69; --lockup-year:#E8450A; --lockup-sub:#5B5B72;
}
.logo.na-ciemnym{
  --lockup-name:#FFFFFF; --lockup-year:#FFB48C; --lockup-sub:#BEB0E4;
}
.logo-badge{width:76px;height:76px;flex:none;border-radius:50%}
.logo-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.logo-name{
  font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;
  font-weight:900;font-size:1.42rem;line-height:1;letter-spacing:-.01em;
  color:var(--lockup-name);
}
.logo-name em{font-style:normal;color:var(--lockup-year)}
.logo-sub{
  font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;
  font-weight:700;font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;
  line-height:1.3;color:var(--lockup-sub);
}
@media (max-width:820px){ .logo-badge{width:58px;height:58px} }
</style>

<div class="logo">
  <svg class="logo-badge" role="img" aria-label="PCTP — Pomorskie Centrum Terapii Pedagogicznej">
    <use href="#pctp-logo"/>
  </svg>
  <div class="logo-txt">
    <span class="logo-name">EduPlaner <em>2026</em></span>
    <span class="logo-sub">PCTP Koszalin &middot; Pomorskie Centrum Terapii Pedagogicznej</span>
  </div>
</div>
